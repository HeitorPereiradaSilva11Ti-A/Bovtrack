<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar animal - Bovtrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend+Giga:wght@100..900&family=Saira+Semi+Condensed:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="recursos.css">
  <!-- Script Unificado de Tema e Navegação -->
  <script src="changemode.js" defer></script>
  <script src="recursos.js" defer></script>
  <script src="api-cliente.js" defer></script>
  <script src="cadastrar-animal.js" defer></script>
</head>
<body data-pagina="cadastrar-animal">
<header>
  <a href="index.html" class="logo">BOVTRACK</a>

  <button class="hamburger" id="hamburgerBtn" aria-label="Abrir Menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav class="nav-menu" id="navMenu">
    <a href="instrucoes.html">INSTRUÇÕES</a>
    <a href="produto.html">PRODUTO</a>
    <a href="quem-somos.html">QUEM SOMOS</a>
    <a href="referencias.html">REFERÊNCIAS</a>
    <a href="jogo.html">JOGO</a>
    <a href="recursos.html" class="active">RECURSOS</a>
  </nav>

  <div class="right">
    <button class="theme-toggle" aria-label="Alternar tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2b0f30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

        <a href="login.html" class="login-text" id="link-login">LOGIN</a>

    <button class="login-icon" id="btn-sair" aria-label="Sair da conta" title="Sair" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
    </button>
  </div>
</header>

<main class="rec">
  <div class="rec-topo">
    <a class="rec-voltar" id="voltar" href="registros.html" aria-label="Voltar"><span data-icone="voltar"></span></a>
    <h1 class="rec-titulo" id="titulo">Cadastrar animal</h1>
  </div>

  <form class="form-animal" id="form-animal" novalidate>
    <div class="form-animal__campos">
      <label class="campo">Número (brinco) *
        <input name="numero" required maxlength="20" placeholder="Ex.: 40028922">
      </label>
      <label class="campo">Nome *
        <input name="nome" required maxlength="100" placeholder="Ex.: Bartolomeu">
      </label>
      <label class="campo">Raça *
        <select name="raca_id" id="raca" required>
          <option value="">Carregando...</option>
        </select>
      </label>
      <label class="campo">Data de nascimento
        <input type="date" name="nascimento">
      </label>
      <label class="campo">Sexo
        <select name="sexo">
          <option value="">Não informado</option>
          <option value="macho">Macho</option>
          <option value="femea">Fêmea</option>
        </select>
      </label>
      <label class="campo">Categoria
        <select name="categoria">
          <option value="">Não informada</option>
          <option value="corte">Corte</option>
          <option value="leite">Leite</option>
        </select>
      </label>
      <label class="campo">Altura (m)
        <input type="number" name="altura" step="0.01" min="0.3" max="3" placeholder="Ex.: 1,76">
      </label>
      <label class="campo">Peso (arrobas)
        <input type="number" name="peso" step="0.1" min="1" max="200" placeholder="Ex.: 15">
      </label>
    </div>

    <fieldset class="form-animal__imagem">
      <legend>Imagem do animal</legend>
      <div class="img-opcoes">
          <label class="img-opcao">
            <input type="radio" name="imagem" value="boi-nelore.png" checked>
            <img src="assetsbovtrack/recursos/boi-nelore.png" alt="">
            <span>Cinza (Nelore)</span>
          </label>
          <label class="img-opcao">
            <input type="radio" name="imagem" value="boi-angus.png">
            <img src="assetsbovtrack/recursos/boi-angus.png" alt="">
            <span>Preto (Angus)</span>
          </label>
          <label class="img-opcao">
            <input type="radio" name="imagem" value="boi-senepol.png">
            <img src="assetsbovtrack/recursos/boi-senepol.png" alt="">
            <span>Vermelho (Senepol)</span>
          </label>
          <label class="img-opcao">
            <input type="radio" name="imagem" value="boi-guzera.png">
            <img src="assetsbovtrack/recursos/boi-guzera.png" alt="">
            <span>Com chifres (Guzerá)</span>
          </label>
      </div>
    </fieldset>

    <p class="form-animal__erro" id="erro" role="alert" hidden></p>
    <div class="form-animal__acoes">
      <button type="submit" class="form-animal__btn">Cadastrar animal</button>
      <button type="button" class="form-animal__excluir" id="btn-excluir" hidden>Excluir animal</button>
    </div>
  </form>
</main>
</body>
</html>
