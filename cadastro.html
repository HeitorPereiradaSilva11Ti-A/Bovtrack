<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro | Bovtrack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">

  <script>
    // Lê o mesmo valor que o botão da lua salva no changemode.js
    try {
      if (JSON.parse(localStorage.getItem('darkmode')) === true) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <main class="login">

    <!-- Lado esquerdo: marca -->
    <section class="login__brand">
      <a class="login__back" href="index.html">&lsaquo; Voltar para o site</a>

      <div class="login__brand-content">
        <h1 class="login__logo" role="img" aria-label="Bovtrack"></h1>
        <div class="login__bull" role="img" aria-label="Touro roxo com circuitos, mascote do Bovtrack"></div>
      </div>
    </section>

    <!-- Lado direito: formulário -->
    <section class="login__panel">
      <p class="login__tag">Cadastre-se</p>

      <form class="login__form" id="form-cadastro" novalidate>
        <h2>Faça seu Cadastro</h2>
        <p class="login__subtitle">Conecte-se para continuar sua jornada.</p>

        <label class="field">
          <span class="visually-hidden">E-mail</span>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        </label>

        <label class="field">
          <span class="visually-hidden">Senha</span>
          <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="new-password" required>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </label>

        <div class="login__options">
          <label class="check">
            <input type="checkbox" name="lembrar">
            <span>Salvar senha</span>
          </label>
        </div>

        <p class="login__erro" id="erro" role="alert" hidden></p>

        <button type="submit" class="login__btn">Cadastre-se</button>
        <hr class="login__line">

        <p class="login__alt"><a href="login.html">Você já possui Login?</a></p>
      </form>
    </section>

  </main>
<script>
  const CHAVE_USUARIOS = 'bovtrack_usuarios';
  const CHAVE_SESSAO = 'bovtrack_sessao';

  async function gerarHash(email, senha) {
    const texto = email + ':' + senha;
    if (window.crypto && crypto.subtle) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
    return 'plain:' + texto;
  }

  function lerUsuarios() {
    try { return JSON.parse(localStorage.getItem(CHAVE_USUARIOS)) || []; }
    catch (e) { return []; }
  }

  const form = document.getElementById('form-cadastro');
  const erro = document.getElementById('erro');
  const botao = form.querySelector('.login__btn');

  function mostrarErro(msg) {
    erro.textContent = msg;
    erro.style.color = '';
    erro.hidden = false;
    botao.disabled = false;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erro.hidden = true;
    botao.disabled = true;

    const email = form.email.value.trim().toLowerCase();
    const senha = form.senha.value;

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return mostrarErro('Digite um e-mail válido.');
    if (senha.length < 6) return mostrarErro('A senha precisa ter pelo menos 6 caracteres.');

    const usuarios = lerUsuarios();
    if (usuarios.some(u => u.email === email)) return mostrarErro('Já existe uma conta com esse e-mail.');

    usuarios.push({
      email,
      senha: await gerarHash(email, senha),
      criadoEm: new Date().toISOString()
    });

    try {
      localStorage.setItem(CHAVE_USUARIOS, JSON.stringify(usuarios));
    } catch (err) {
      return mostrarErro('Não foi possível salvar o cadastro neste navegador.');
    }

    // Já deixa a pessoa logada
    const sessao = JSON.stringify({ email, entrouEm: Date.now() });
    sessionStorage.removeItem(CHAVE_SESSAO);
    localStorage.removeItem(CHAVE_SESSAO);
    (form.lembrar.checked ? localStorage : sessionStorage).setItem(CHAVE_SESSAO, sessao);

    erro.textContent = 'Cadastro realizado! Entrando...';
    erro.style.color = '#2e7d32';
    erro.hidden = false;
    setTimeout(() => { window.location.href = 'index.html'; }, 900);
  });
</script>
</body>
</html>
