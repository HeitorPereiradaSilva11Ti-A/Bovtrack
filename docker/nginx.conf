# Serve o site estático. Bloqueia arquivos que não são do site
# (configurações, .env, o banco.sql e a pasta do Docker).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location ~ /\.            { deny all; return 404; }
    location ^~ /backend/     { deny all; return 404; }
    location ^~ /docker/      { deny all; return 404; }
    location ~ ^/docker-compose { deny all; return 404; }
    location ~ \.md$          { deny all; return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
