<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="temperatura.css">

</head>
<body>

  <header>
    <a href="../index.html" class="logo">BOVTRACK</a>
    <nav>

      <a href="../quem-somos.html">QUEM SOMOS</a>
      <a href="../referencias.html">REFERÊNCIAS</a>
      <a href="../jogo.html">JOGO</a>
      <a href="../recursos.html">RECURSOS</a>
    </nav>
    <div class="right-header">
      <button class="theme-toggle" aria-label="Alternar tema">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
      <span class="login-text">LOGIN</span>
      <button class="login-icon" aria-label="Entrar">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
        </svg>
      </button>
    </div>
  </header>

  <main class="content-container">
    <div class="left-column">
      <a href="../produto.html" class="back-link">
        <span class="arrow">&lt;</span> Polo de<br>Temperatura
      </a>

      <p class="subtitle">Todos os polos são revestidos de impressão 3d*</p>

      <div class="cards-row">
        <!-- Card Placa Universal Perfurada -->
        <article class="card">
          <div class="card-img-wrapper">
            <img src="../assetsbovtrack/Placa universal perfurada.png" alt="Placa universal perfurada">
          </div>
          <span class="card-title">Placa universal perfurada</span>
          <span class="card-price">Preço: R$20,00</span>
        </article>

        <!-- Card ESP32 -->
        <article class="card">
          <div class="card-img-wrapper">
            <img src="../assetsbovtrack/Esp32.png" alt="ESP32">
          </div>
          <span class="card-title">ESP32</span>
          <span class="card-price">Preço: R$70,00</span>
        </article>

        <!-- Card Sensor de Temperatura -->
        <article class="card">
          <div class="card-img-wrapper">
            <img src="../assetsbovtrack/Sensor de Temperatura Infravermelho IR MLX90614.png" alt="Sensor MLX90614">
          </div>
          <span class="card-title">Sensor de Temperatura Infravermelho IR MLX90614</span>
          <span class="card-price">Preço: R$80,00</span>
        </article>
      </div>

    <div class="right-column">
      <div class="main-image-container">
        <img src="../assetsbovtrack/polo_temperatura.png" alt="Polo de temperatura" class="main-image">
